name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Deny warnings, but keep the noise-suppressions the workspace applies locally
  # via .cargo/config.toml. An env RUSTFLAGS overrides that file entirely, so the
  # allows must be repeated here or dead_code/unused_imports/unexpected_cfgs would
  # turn into hard errors and break the build.
  RUSTFLAGS: "-D warnings -A unexpected_cfgs -A dead_code -A unused_imports"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          sudo apt-get clean
          df -h /
      - run: sudo apt-get update && sudo apt-get install -y libleptonica-dev libtesseract-dev
      - name: Check workspace (CPU-only)
        run: cargo check --workspace --all-targets
      - name: Check GPU/CUDA crates
        run: |
          cargo check --manifest-path scirust-gpu/Cargo.toml --all-targets
          cargo check --manifest-path soullink-brain/soullink-cutlass/Cargo.toml --all-targets
          cargo check --manifest-path soullink-brain/soullink-dali/Cargo.toml --all-targets
          cargo check --manifest-path soullink-brain/soullink-onednn/Cargo.toml --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          sudo apt-get clean
          df -h /
      - run: sudo apt-get update && sudo apt-get install -y libleptonica-dev libtesseract-dev
      - name: Test workspace (CPU-only)
        run: cargo test --workspace --lib --exclude soulsystem --exclude soul-kernel
      # GPUs may be missing on some runners — skip silently
      - run: cargo test -p soulsystem --tests -- --test-threads=2

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          sudo apt-get clean
          df -h /
      - run: sudo apt-get update && sudo apt-get install -y libleptonica-dev libtesseract-dev
      - name: Clippy workspace (CPU-only)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy GPU/CUDA crates
        run: |
          cargo clippy --manifest-path scirust-gpu/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path soullink-brain/soullink-cutlass/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path soullink-brain/soullink-dali/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path soullink-brain/soullink-onednn/Cargo.toml --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Advisories, bans, licenses, sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --workspace

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Generates a CycloneDX SBOM for the workspace. This is the inventory
      # `cargo deny` checks against: deny answers "is anything we depend on
      # known-bad today", the SBOM answers "what exactly did this build
      # contain" — which is the question asked after a CVE lands, about a
      # binary that shipped weeks ago.
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - name: Generate SBOM
        run: cargo cyclonedx --format json --all
      # Collect into one directory before uploading.
      #
      # Uploading with a `**/*.cdx.json` glob makes upload-artifact walk the
      # whole repository, and it dies on the first entry it cannot stat:
      #   EACCES: permission denied, stat '.../avid/scirust-autodiff'
      # The SBOMs had already been generated fine — only the upload's tree
      # walk failed. Collecting first means the upload sees one flat
      # directory and never touches the rest of the tree.
      - name: Collect SBOMs
        run: |
          set -euo pipefail
          mkdir -p sbom-out
          # -print0/xargs -0 for paths with spaces; the 2>/dev/null suppresses
          # the same unreadable-directory noise, and the count check below is
          # what actually decides success.
          find . -name '*.cdx.json' -not -path './sbom-out/*' -print0 2>/dev/null \
            | xargs -0 -r -I{} cp {} sbom-out/
          count=$(find sbom-out -name '*.cdx.json' | wc -l)
          echo "collected $count SBOM file(s)"
          # Fail loudly rather than uploading an empty artifact that looks
          # like a passing SBOM job.
          test "$count" -gt 0
      # Uploaded as a build artifact rather than committed: an SBOM is a fact
      # about one build, and a committed copy goes stale the moment a
      # dependency resolves differently.
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom-out/
          if-no-files-found: error

  msrv:
    name: MSRV (1.93.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          sudo apt-get clean
          df -h /
      - run: sudo apt-get update && sudo apt-get install -y libleptonica-dev libtesseract-dev
      - name: Check workspace against declared MSRV
        run: cargo check --workspace --all-targets
