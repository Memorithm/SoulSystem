name: Autopilot rustls remediation

on:
  push:
    branches:
      - agent/coding-task-json-interchange

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      - name: Update only rustls to the patched release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('Cargo.lock').read_text()
          m = re.search(r'\[\[package\]\]\nname = "rustls"\nversion = "([^"]+)"', text)
          if not m:
              raise SystemExit('rustls lock entry not found')
          if m.group(1) != '0.23.40':
              raise SystemExit(f'unexpected pre-update rustls version: {m.group(1)}')
          PY
          cargo update -p rustls --precise 0.23.45
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          text = Path('Cargo.lock').read_text()
          m = re.search(r'\[\[package\]\]\nname = "rustls"\nversion = "([^"]+)"\nsource = "registry\+https://github.com/rust-lang/crates.io-index"\nchecksum = "([0-9a-f]+)"', text)
          if not m:
              raise SystemExit('updated rustls lock entry not found')
          expected = ('0.23.45', '0d41d731c7d2f962d1ccc364cec258de3c0e93b38c2fb3ba97ac74513048d634')
          if m.groups() != expected:
              raise SystemExit(f'unexpected post-update rustls entry: {m.groups()}')
          changed = subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          if changed != ['Cargo.lock']:
              raise SystemExit(f'cargo update changed unexpected files: {changed}')
          PY
      - name: Commit the lockfile remediation and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/autopilot-rustls-remediation.yml
          git config user.name 'ZEKRITI TAREK'
          git config user.email 'contact@checkupauto.fr'
          git add Cargo.lock .github/workflows/autopilot-rustls-remediation.yml
          git commit -m 'fix(security): update rustls for RUSTSEC-2026-0285'
          git push origin HEAD:agent/coding-task-json-interchange
