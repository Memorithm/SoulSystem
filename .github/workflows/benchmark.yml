name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  benchmark:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'soul' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Install benchmark dependencies
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends linux-tools-common linux-tools-generic

      - name: Run benchmarks
        run: |
          cd soullink-brain
          cargo bench --bench hnn_benchmark -- --output-format bencher | tee ../benchmark_results.txt

      - name: Store benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results
          path: benchmark_results.txt

      - name: Check for performance regression
        if: github.event_name == 'pull_request'
        run: |
          echo "TODO: Compare with main branch baseline"
          echo "Install and use cargo-criterion for automated regression detection"