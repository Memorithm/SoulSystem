name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Superseded pull request runs are cancelled (shared self-hosted VMs);
  # push, schedule and dispatch runs get a unique group and are never cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmark:
    runs-on: [self-hosted, Linux, X64, remoteops, ci-isolated]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install benchmark dependencies
        run: |
          sudo apt-get update -qq
          # Debian (Memorithm VMs) ships perf as linux-perf; Ubuntu as linux-tools-*.
          if grep -qi ubuntu /etc/os-release; then pkgs="linux-tools-common linux-tools-generic"; else pkgs="linux-perf"; fi
          sudo apt-get install -y -qq --no-install-recommends $pkgs

      - name: Run benchmarks
        run: |
          cd soullink-brain
          cargo bench --bench hnn_benchmark -- --output-format bencher | tee ../benchmark_results.txt

      - name: Store benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results.txt

      - name: Check for performance regression
        if: github.event_name == 'pull_request'
        run: |
          echo "TODO: Compare with main branch baseline"
          echo "Install and use cargo-criterion for automated regression detection"