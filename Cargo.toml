ccos = { workspace = true }

[dev-dependencies]
# `ServiceExt::oneshot`, for driving the api router in tests.
tower = { workspace = true }

[features]
dev = []
gpu = []
ed25519 = ["dep:ed25519-dalek"]
avid = []
brain_system = []
soul_neural = []
organs = []
mesh = []
services = []
openevolve = []
synergie = []
default = ["ed25519"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[workspace.lints.rust]
dead_code = "allow"
unused_imports = "allow"
unused_variables = "allow"
unused_mut = "allow"
unused_assignments = "allow"
unused_unsafe = "allow"
unused_comparisons = "allow"
unreachable_pub = "allow"
non_camel_case_types = "allow"
non_snake_case = "allow"
deprecated = "allow"
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(blas)', 'cfg(rayon)'] }
missing_docs = "allow"

[profile.dev]
opt-level = 0
debug = true
incremental = true
codegen-units = 256
