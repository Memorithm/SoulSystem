    # preserving path dependencies such as scirust-core -> scirust-gpu.
    "scirust-gpu",
    "soullink-brain/soullink-cutlass",
    "soullink-brain/soullink-dali",
    "soullink-brain/soullink-onednn",
]

[workspace.package]
version = "13.5.0"
edition = "2021"
rust-version = "1.93"
authors = ["SoulLink Mesh Team"]
license = "MIT"
repository = "internal"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "time", "process", "fs", "sync", "signal", "net", "io-util", "io-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tempfile = "3"
arc-swap = "1.7"
dashmap = "6"
parking_lot = "0.12"
ahash = "0.8"
metrics = "0.23"
metrics-exporter-prometheus = { version = "0.15", default-features = false, features = ["http-listener"] }
prometheus = "0.14"
async-trait = "0.1"
futures-util = "0.3.32"
subtle = "2.5"
sha2 = "0.10"
hmac = "0.12"
ed25519-dalek = "2"

colored = "3"
crossterm = "0.29"
cudarc = "0.13"
dirs = "6"
half = "2"
lazy_static = "1"
log = "0.4"
ndarray = "0.16"
ratatui = "0.30"
uuid = { version = "1", features = ["v4", "serde"] }
rmp-serde = "1.1"
futures = { version = "0.3", default-features = false, features = ["std"] }
wiremock = "0.6"
criterion = { version = "0.5", default-features = false, features = ["async_tokio", "html_reports"] }
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "tokio", "tower-log"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["trace", "cors", "limit", "set-header"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
nvml-wrapper = { version = "0.9", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
toml = "0.8"
regex = "1.10"
thiserror = "2"
anyhow = "1"
rand = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
clap = { version = "4", features = ["derive"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
keyring = "4.1.5"
rpassword = "7.4"
redb = "2"

# local workspace crates
ansi-converter = { path = "ansi-converter" }
bus = { path = "bus" }
bound-system = { path = "bound-system" }
clawd = { path = "clawd" }
local-skills = { path = "local-skills" }
model-router = { path = "model-router" }
pty-terminal = { path = "pty-terminal" }
soul-memory = { path = "soul-memory" }
soul-bridge = { path = "soul-bridge" }
spinner = { path = "spinner" }
terminal-stream = { path = "terminal-stream" }
soulsystem-common = { path = "crates/soulsystem-common" }
soul-cors = { path = "crates/soul-cors" }
soul-auth = { path = "crates/soul-auth" }
soul_sandbox = { path = "soul_sandbox" }
soul-prod-guard = { path = "crates/soul-prod-guard" }
ccos = { path = "ccos" }
octasoma = { path = "octasoma" }

[package]
name = "soulsystem"
# Inherited, not restated: the root binary shipped 0.6.0 while every workspace
# member carried 13.5.0, so `soulsystem --version` disagreed with the release
# it was built from (LOW-002). A literal here can drift again; the workspace
# value cannot.
version.workspace = true
edition = "2021"
description = "SoulSystem — Autonomous digital agent ecosystem"
license = "MIT OR Apache-2.0"

[dependencies]
bus = { workspace = true }
soul-bridge = { workspace = true }
soul-memory = { workspace = true }
soulsystem-common = { workspace = true }
soul-prod-guard = { workspace = true }
bound-system = { workspace = true }
clawd = { workspace = true }
ansi-converter = { workspace = true }
terminal-stream = { workspace = true }
pty-terminal = { workspace = true }
local-skills = { workspace = true }
model-router = { workspace = true }
spinner = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
sled = "0.34"
seahash = "4.1"
chrono = { workspace = true }
sha2 = { workspace = true }
hostname = "0.4"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
rand = { workspace = true }
uuid = { workspace = true }
ed25519-dalek = { version = "2", optional = true }
rusqlite = { version = "0.32", features = ["bundled"] }
which = "8"
sysinfo = "0.31"
crossterm = { workspace = true }
clap = { workspace = true }
rpassword = { workspace = true }
tar = "0.4"
flate2 = "1"
reqwest = { workspace = true }
teloxide = { version = "0.17", features = ["macros", "ctrlc_handler"] }
tokio-stream = { workspace = true }
axum = { workspace = true }
soullink-memory = { path = "soullink-brain/soullink-memory" }
